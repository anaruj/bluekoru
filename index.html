<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bluekoru</title>
  <style>
    :root { --ink: #285a78; --fire: #cc3e0b; --y: 3.5vh; --glow: 0 0 1.2em rgba(255,255,255,.45); }
    html, body { height: 100%; margin: 0; }
    body { background: #c3cde6; overflow: hidden; }
    .hero { position: fixed; inset: 0; }
    .hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .mark {
      position: fixed; left: 0; right: 0; top: var(--y);
      text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: clamp(3.5rem, min(14vw, 14vh), 9rem);
    }
    /* shrink-to-fit, so the caption can right-align to the end of "koru" */
    .inner { display: inline-block; text-align: right; }
    h1 {
      margin: 0; font-size: inherit; font-weight: 400;
      letter-spacing: 0.02em;
      color: var(--ink);
      text-shadow: var(--glow);
    }
    h1 b { font-weight: inherit; color: var(--fire); }
    .place {
      /* top: pull up under the wordmark's line box; right: .09em of this size = the wordmark's trailing letter-spacing */
      margin: -1.1em .09em 0 0;
      font-size: .22em; font-style: italic;
      color: var(--fire);
      text-shadow: var(--glow);
    }
    .place:empty { display: none; }
    /* hold everything back until the chosen photo and its colours are ready */
    .hero, .mark { opacity: 0; transition: opacity .5s ease; }
    .ready .hero, .ready .mark { opacity: 1; }
    .still .hero, .still .mark { transition: none; }
  </style>
  <noscript>
    <style>.hero, .mark { opacity: 1; } .hero img { object-position: 62% 50%; }</style>
  </noscript>
</head>
<body>
  <picture class="hero" id="hero">
    <noscript>
      <img src="img/karikari-harakeke-20201128-1920.webp"
           alt="Orange harakeke flowers in front of the sea at Karikari">
    </noscript>
  </picture>
  <div class="mark"><div class="inner">
    <h1>blue<b>koru</b></h1>
    <p class="place" id="place"></p>
  </div></div>
  <script>
    (async () => {
      const root = document.documentElement;
      if (new URLSearchParams(location.search).has('still')) root.classList.add('still');
      const ready = () => root.classList.add('ready');
      try {
        const all = (await (await fetch('images.json')).json()).images;
        const wanted = new URLSearchParams(location.search).get('img');
        let pick = wanted && all.find(i => i.id === wanted);
        if (!pick) {
          // shuffle bag: show every live image once before any repeats.
          // The bag is kept in localStorage and forgotten after a day.
          const live = all.filter(i => !i.draft);
          const ids = live.map(i => i.id);
          const DAY = 24 * 60 * 60 * 1000;
          let bag = [], recent = [];
          try {
            const s = JSON.parse(localStorage.getItem('bag'));
            if (s && Date.now() - s.at < DAY) {
              bag = s.queue.filter(id => ids.includes(id));
              recent = (s.recent || []).filter(id => ids.includes(id));
            }
          } catch {}
          if (!bag.length) {
            bag = ids.slice();
            for (let n = bag.length - 1; n > 0; n--) {
              const j = Math.floor(Math.random() * (n + 1));
              [bag[n], bag[j]] = [bag[j], bag[n]];
            }
            // the bag is used from the end, so move the images that closed the
            // last round to the front: they come round again as late as possible
            bag = [...bag.filter(id => recent.includes(id)), ...bag.filter(id => !recent.includes(id))];
          }
          const id = bag.pop();
          pick = live.find(i => i.id === id);
          // remember the last half-set shown, for the next shuffle
          recent = [...recent.filter(r => r !== id), id].slice(-Math.floor(ids.length / 2));
          try { localStorage.setItem('bag', JSON.stringify({ queue: bag, recent, at: Date.now() })); } catch {}
        }
        const glows = {
          light: '0 0 1.2em rgba(255,255,255,.45)',
          dark: '0 0 1.2em rgba(0,0,0,.45)',
          none: 'none'
        };
        document.getElementById('place').textContent = pick.place || '';
        root.style.setProperty('--ink', pick.ink);
        root.style.setProperty('--fire', pick.fire);
        root.style.setProperty('--y', pick.y + 'vh');
        root.style.setProperty('--glow', glows[pick.glow] || glows.none);
        const img = new Image();
        img.onload = img.onerror = ready;
        img.alt = pick.alt;
        img.sizes = `max(100vw, ${(pick.aspect * 100).toFixed(2)}vh)`;
        img.srcset = pick.widths.map(w => `${pick.base}-${w}.webp ${w}w`).join(', ');
        img.style.objectPosition = pick.focus;
        const hero = document.getElementById('hero');
        hero.replaceChildren(img);
      } catch (e) { ready(); }
    })();
  </script>
</body>
</html>
