<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bluekoru</title>
  <style>
    :root { --bg: #f7f9fc; --fg: #0b2545; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b1320; --fg: #cfe3ff; } }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    h1 { font-weight: 300; font-size: clamp(2.5rem, 10vw, 6rem); letter-spacing: 0.05em; margin: 0; }
  </style>
</head>
<body>
  <h1>bluekoru</h1>
</body>
</html>
